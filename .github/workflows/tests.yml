name: tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m py_compile plugins/claude-guard/scripts/guard.py plugins/claude-guard/scripts/claude_guard/*.py
